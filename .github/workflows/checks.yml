name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Offline protocol, native selection and performance checks
        run: ./scripts/check.sh
      - name: Build application
        run: ./scripts/build-app.sh
      - name: Verify bundle
        run: codesign --verify --deep --strict dist/Senda.app
